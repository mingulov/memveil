# SPDX-License-Identifier: GPL-3.0-or-later
# Tier 1: unprivileged offline suites. Safe for pull requests
# from any source: no privileges, no network fixtures, no
# secrets. Every lane must pass; none may skip silently.
#
# The lanes need the locked toolchain (toolchain.lock.json):
# ubuntu-26.04 ships its generations, apt provisions the
# system tools, and tools/build verifies every exact version
# before compiling. The libbpf_mojo import tree comes from
# the vendored pinned tarball via LMB_PACKAGE (hash-checked
# here and re-verified by the build); without it the build
# fails instead of compiling a bridge-less binary.
#
# Deliberately absent: confidential-ranges, confidential-real,
# confidential-late-attach. Those gates need armed live kernels
# (exit 77 unarmed), so they belong to Tier 3 runners with real
# fixtures, not to this unprivileged tier. Everything else in
# `tools/test --help` runs in Tier 1 or Tier 2.
name: offline

on:
  push:
  pull_request:

jobs:
  offline:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v4
      - name: Install pixi
        run: |
          curl -fsSL https://pixi.sh/install.sh | \
            PIXI_VERSION=0.81.0 bash
          echo "$HOME/.pixi/bin" >> "$GITHUB_PATH"
      - name: Install system toolchain
        run: |
          sudo apt-get update
          # The image preinstalls a newer cmake; the locked
          # toolchain needs exactly the archive version.
          sudo apt-get install -y --no-install-recommends \
            --allow-downgrades \
            clang bpftool cmake=4.2.3-2ubuntu2 ninja-build
          # The image also ships a Kitware cmake in /usr/local
          # that shadows the archive binary; remove it so the
          # locked cmake resolves (verified by tools/build).
          sudo rm -f /usr/local/bin/cmake /usr/local/bin/ctest \
            /usr/local/bin/cpack /usr/local/bin/ccmake
      - name: Provision libbpf-mojo tarball
        run: |
          VER="$(python3 -c "import json; print(json.load(open('toolchain.lock.json'))['dependencies']['libbpf-mojo']['version'])")"
          TARBALL="third_party/libbpf-mojo-$VER.tar.gz"
          WANT="$(python3 -c "import json; print(json.load(open('toolchain.lock.json'))['dependencies']['libbpf-mojo']['tarball_sha256'])")"
          echo "$WANT  $TARBALL" | sha256sum --check -
          echo "LMB_PACKAGE=$GITHUB_WORKSPACE/$TARBALL" >> "$GITHUB_ENV"
      - name: Build
        run: ./tools/build
      - name: Offline suites
        run: |
          for suite in schemas unit reports profiles doctor \
              identity correlation mappings lifetimes pools \
              regions conversion-normalize confidential-hooks \
              region-resolution baseline confidential-inventory \
              diagnostics top oracle-ledger profile-semantics \
              stop budgets quality reader-adversarial \
              fuzz-smoke fuzz-campaign record-failures \
              output-paths privacy render-escaping \
              offline-environment perf-replay preview-package \
              provenance docs examples package source-export \
              release-runtime; do
            ./tools/test "$suite" || exit 1
          done
