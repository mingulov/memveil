# SPDX-License-Identifier: GPL-3.0-or-later
# Tags never build or publish. Every operation needs a reviewed dispatch request.
name: release
on:
  workflow_dispatch:
    inputs:
      mode:
        description: Import, dry-run, or promote already qualified bytes
        type: choice
        options: [import, dry-run, promote]
        required: true
      arm:
        description: Explicitly enter ARM-IMPORT, ARM-DRY-RUN, or ARM-PROMOTE
        type: string
        required: true
      request:
        description: Reviewed JSON request with C, Q, candidate digest and immutable remote IDs
        type: string
        required: true
permissions:
  contents: write
  actions: read
  checks: read
  id-token: write
  attestations: write
concurrency:
  group: release-custody
  cancel-in-progress: false
jobs:
  custody:
    runs-on: ubuntu-26.04
    environment: release-custody
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install archive verification tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends rpm2cpio cpio binutils openssh-client
      - name: Verify and import or promote exact stored bytes
        env:
          GH_TOKEN: ${{ github.token }}
          CUSTODY_REQUEST: ${{ inputs.request }}
          CUSTODY_ARM: ${{ inputs.arm }}
          CUSTODY_MODE: ${{ inputs.mode }}
        run: |
          command -v gh
          command -v ssh-keygen
          command -v readelf
          command -v dpkg-deb
          command -v rpm2cpio
          command -v cpio
          ./tools/candidate-custody "$CUSTODY_MODE" --out custody-output
      - name: Attest imported custody, never a GitHub build
        if: inputs.mode == 'import'
        uses: actions/attest@daf44fb950173508f38bd2406030372c1d1162b1  # v3.0.0
        with:
          subject-path: custody-output/stored/*
          predicate-type: https://memveil.org/attestations/memveil-candidate-import/1
          predicate-path: custody-output/stored/custody.json
      - name: Retain immutable imported bytes for the qualification campaign
        if: inputs.mode == 'import'
        id: retained
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: candidate-${{ fromJSON(inputs.request).candidate_sha256 }}
          path: custody-output/stored/*
          compression-level: 0
          retention-days: 90
          if-no-files-found: error
          overwrite: false
      - name: Record immutable transport IDs for evidence-only successor
        if: inputs.mode == 'import'
        env:
          ARTIFACT_ID: ${{ steps.retained.outputs.artifact-id }}
          ARTIFACT_DIGEST: ${{ steps.retained.outputs.artifact-digest }}
        run: |
          python3 - <<'PY'
          import json, os
          print(json.dumps({k: os.environ[k] for k in (
              'GITHUB_REPOSITORY', 'GITHUB_REPOSITORY_ID', 'GITHUB_RUN_ID',
              'GITHUB_SHA', 'ARTIFACT_ID', 'ARTIFACT_DIGEST')}, sort_keys=True))
          PY
