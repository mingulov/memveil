# SPDX-License-Identifier: GPL-3.0-or-later
# Dispatch-only release pipeline: one mode per dispatch, each
# dispatch runs only its own stage. The operator seals and
# signs locally (the primary path); the hosted flow only
# re-verifies and carries those bytes. Mode to jobs:
#   qualify -> qualify (independent re-verification: the
#              draft assets by recorded ID plus Q's records,
#              digests plus qualify plus export, zero builds)
#   import  -> import (consumes the sealed set via the draft
#              assets, stores the remote artifact, attests)
#   dry-run -> dry-run (consumes the recorded import only)
#   promote -> promote (consumes the recorded import only)
# Every job consumes draft or recorded bytes with digest
# verification and runs zero builds of the candidate. All
# dispatches run with the workflow ref at the qualification
# commit Q (evidence-only over C); dry-run validates the
# proposed tag while it must not exist yet, so the owner
# creates the final tag on C after a green dry-run and only
# then dispatches promote. See RELEASING.md for the operator
# order.
#
# Trust rule: every job checks out the trusted workflow ref
# for its tools and scripts, and reads C's bytes (policy,
# lock, Cargo version) with git show from that checkout,
# data-only, never executed and never built. Checkouts
# persist no credentials: later git steps run unauthenticated
# and gh carries its own GH_TOKEN, so a compromised step
# gains no push or fetch capability. Dispatch inputs are
# validated as data (digest pattern, 40-hex commit plus a git
# object check, decimal IDs) before use, and digests are
# compared in Python, never interpolated into shell. Signing
# is local-only: no signing key ever enters this workflow.
# Custody jobs build the verifier from the trusted checkout
# inside the job and never execute sealed bytes: the sealed
# set carries no executable harness.
#
# Toolchain pin for the in-job verifier builds, matching the
# tree: Rust 1.100.0 (rust-toolchain.toml). No eBPF toolchain
# is installed here: nothing builds the candidate hosted.
name: release

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'Pipeline stage to run'
        required: true
        type: choice
        options: [qualify, import, dry-run, promote]
      candidate_sha256:
        description: 'Sealed candidate digest to release'
        required: true
        type: string
      source_commit:
        description: 'Source commit C the candidate seals'
        required: true
        type: string
      promote_authorization:
        description: 'Retype candidate_sha256 to authorize publishing'
        required: false
        type: string
        default: ''
      import_run_id:
        description: 'Recorded import workflow run ID (consumers only)'
        required: false
        type: string
        default: ''
      import_artifact_id:
        description: 'Recorded import artifact ID (consumers only)'
        required: false
        type: string
        default: ''
      draft_release_id:
        description: 'Holding draft release ID (qualify/import only)'
        required: false
        type: string
        default: ''

permissions: {}

jobs:
  qualify:
    if: inputs.mode == 'qualify'
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Validate dispatch inputs as data
        env:
          CANDIDATE_SHA256: ${{ inputs.candidate_sha256 }}
          SOURCE_COMMIT: ${{ inputs.source_commit }}
          DRAFT_RELEASE_ID: ${{ inputs.draft_release_id }}
        run: |
          set -eu
          python3 - <<'EOF'
          import os
          import re
          import sys
          sha = os.environ.get("CANDIDATE_SHA256") or ""
          commit = os.environ.get("SOURCE_COMMIT") or ""
          if not re.fullmatch(r"[0-9a-f]{64}", sha):
              sys.exit("candidate_sha256 is not 64 lowercase hex")
          if not re.fullmatch(r"[0-9a-f]{40}", commit):
              sys.exit("source_commit is not 40 lowercase hex")
          draft_id = os.environ.get("DRAFT_RELEASE_ID") or ""
          if not re.fullmatch(r"[0-9]+", draft_id):
              sys.exit("draft_release_id is not a decimal ID")
          EOF
          git cat-file -e "$SOURCE_COMMIT^{commit}"
      - name: Read the candidate policy and lock from C
        env:
          SOURCE_COMMIT: ${{ inputs.source_commit }}
        run: |
          set -eu
          git show "$SOURCE_COMMIT:packaging/candidate-policy.json" \
            > c-policy.json
          git show "$SOURCE_COMMIT:tests/vm/kernels.lock.json" \
            > c-lock.json
          test -s c-policy.json
          test -s c-lock.json
      - name: Collect the candidate and the campaign evidence
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CANDIDATE_SHA256: ${{ inputs.candidate_sha256 }}
          SOURCE_COMMIT: ${{ inputs.source_commit }}
          DRAFT_RELEASE_ID: ${{ inputs.draft_release_id }}
        run: |
          set -eu
          mkdir -p draft evidence-dl
          python3 - draft evidence-dl <<'EOF'
          import os
          import sys
          sys.path.insert(0, "tools")
          import candidate
          import candidate_custody as custody
          from pathlib import Path
          repo = os.environ["GITHUB_REPOSITORY"]
          sha = os.environ["CANDIDATE_SHA256"]
          tag = "candidate-" + sha
          api = custody.GitHub()
          release = custody.get_holding_draft(
              api, repo, os.environ["DRAFT_RELEASE_ID"], tag)
          manifest = candidate.load_manifest(
              "packaging/qualifications/candidate.json", sha)
          candidate.verify_q_bound(
              manifest, os.environ["SOURCE_COMMIT"],
              os.environ["GITHUB_SHA"], ".")
          draft = Path(sys.argv[1])
          for entry in manifest["artifacts"]:
              dest = draft / entry["name"]
              custody.download_draft_asset(
                  api, repo, release, entry["name"], dest)
              candidate.verify_file(dest, entry)
          dl = Path(sys.argv[2])
          custody.download_draft_asset(
              api, repo, release, "qualification-evidence.tar.gz",
              dl / "qualification-evidence.tar.gz")
          custody.download_draft_asset(
              api, repo, release, "qualification.json",
              dl / "qualification.json")
          doc = candidate.read_json(
              "packaging/qualifications/qualification.json",
              sealed=True)
          candidate.require(
              (dl / "qualification.json").read_bytes()
              == Path("packaging/qualifications"
                      "/qualification.json").read_bytes(),
              "draft qualification differs from Q")
          candidate.verify_file(
              dl / "qualification-evidence.tar.gz",
              doc["evidence_archive"])
          EOF
          EVIDENCE_DIR=$(python3 - \
            evidence-dl/qualification-evidence.tar.gz \
            evidence <<'EOF'
          import sys
          sys.path.insert(0, "tools")
          import candidate
          from pathlib import Path
          inner = candidate.safe_extract(
              sys.argv[1], Path(sys.argv[2]), True, False)
          print(inner)
          EOF
          )
          test -n "$EVIDENCE_DIR"
          echo "EVIDENCE_DIR=$EVIDENCE_DIR" >> "$GITHUB_ENV"
      - name: Qualify and export the tested payload
        run: |
          set -eu
          test -n "$EVIDENCE_DIR"
          ./tools/candidate qualify \
            --manifest packaging/qualifications/candidate.json \
            --qualification packaging/qualifications/qualification.json \
            --policy c-policy.json \
            --evidence-dir "$EVIDENCE_DIR" \
            --source-tree .
          # Derived only after the qualify gate above
          # authenticated the same bytes; the export branch below
          # authenticates them once more before evaluating them.
          MATRIX_DIR=$(python3 - "$EVIDENCE_DIR" \
            packaging/qualifications/qualification.json <<'EOF'
          import sys
          sys.path.insert(0, "tools")
          import candidate
          from pathlib import Path
          evidence = Path(sys.argv[1])
          doc = candidate.read_json(sys.argv[2], sealed=True)
          gate = doc["gates"][candidate.MATRIX_GATE]
          record = candidate.read_json(
              evidence / candidate.relative(gate["receipt"]),
              sealed=True)
          inputs = candidate.read_json(
              evidence / candidate.relative(record["inputs"]),
              sealed=True)
          print(inputs["matrix_directory"])
          EOF
          )
          test -n "$MATRIX_DIR"
          MV_CANDIDATE_MANIFEST=packaging/qualifications/candidate.json \
          ./tools/kernel-matrix \
            --verify-out \
            --out "$EVIDENCE_DIR/$MATRIX_DIR" \
            --export-tested tested-payload.sha256 \
            --lock c-lock.json \
            --evidence-dir "$EVIDENCE_DIR" \
            --qualification packaging/qualifications/qualification.json \
            --policy c-policy.json \
            --source-tree .
          cmp tested-payload.sha256 packaging/tested-payload.sha256
      - name: Upload the tested payload
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: tested-${{ inputs.candidate_sha256 }}
          path: tested-payload.sha256
          if-no-files-found: error
          retention-days: 90

  import:
    if: inputs.mode == 'import'
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      attestations: write
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Validate dispatch inputs as data
        env:
          CANDIDATE_SHA256: ${{ inputs.candidate_sha256 }}
          SOURCE_COMMIT: ${{ inputs.source_commit }}
          DRAFT_RELEASE_ID: ${{ inputs.draft_release_id }}
        run: |
          set -eu
          python3 - <<'EOF'
          import os
          import re
          import sys
          sha = os.environ.get("CANDIDATE_SHA256") or ""
          commit = os.environ.get("SOURCE_COMMIT") or ""
          if not re.fullmatch(r"[0-9a-f]{64}", sha):
              sys.exit("candidate_sha256 is not 64 lowercase hex")
          if not re.fullmatch(r"[0-9a-f]{40}", commit):
              sys.exit("source_commit is not 40 lowercase hex")
          draft_id = os.environ.get("DRAFT_RELEASE_ID") or ""
          if not re.fullmatch(r"[0-9]+", draft_id):
              sys.exit("draft_release_id is not a decimal ID")
          EOF
          git cat-file -e "$SOURCE_COMMIT^{commit}"
      - name: Install custody tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cpio rpm
      - name: Build the verifier from the trusted checkout
        run: |
          set -eu
          curl -fsSL -o /tmp/rustup-init \
            https://static.rust-lang.org/rustup/dist/x86_64-unknown-linux-gnu/rustup-init
          curl -fsSL -o /tmp/rustup-init.sha256 \
            https://static.rust-lang.org/rustup/dist/x86_64-unknown-linux-gnu/rustup-init.sha256
          (cd /tmp && sha256sum --check rustup-init.sha256)
          chmod +x /tmp/rustup-init
          /tmp/rustup-init -y --profile minimal --default-toolchain none
          export PATH="$HOME/.cargo/bin:$PATH"
          rustup toolchain install 1.100.0 --profile minimal
          cargo fetch --locked
          cargo build -p memveil-release-entry --locked --offline
          test -x target/debug/memveil-release-entry
      - name: Import the holding draft
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CUSTODY_ARM: ARM-IMPORT
          GITHUB_EVENT_NAME: workflow_dispatch
          SOURCE_COMMIT: ${{ inputs.source_commit }}
          CANDIDATE_SHA256: ${{ inputs.candidate_sha256 }}
          DRAFT_RELEASE_ID: ${{ inputs.draft_release_id }}
        run: |
          set -eu
          VERSION=$(git show "$SOURCE_COMMIT:Cargo.toml" \
            | grep -m1 '^version = ' | cut -d'"' -f2)
          test -n "$VERSION"
          export FINAL_TAG="v$VERSION"
          python3 - release.json > request.json <<'EOF'
          import json, os, sys
          sys.path.insert(0, "tools")
          import candidate_custody as custody
          repo = os.environ["GITHUB_REPOSITORY"]
          tag = "candidate-" + os.environ["CANDIDATE_SHA256"]
          release = custody.get_holding_draft(
              custody.GitHub(), repo,
              os.environ["DRAFT_RELEASE_ID"], tag)
          with open(sys.argv[1], "w") as stream:
              json.dump(release, stream, sort_keys=True)
          print(json.dumps({
              "repository": os.environ["GITHUB_REPOSITORY"],
              "source_commit": os.environ["SOURCE_COMMIT"],
              "qualification_commit": os.environ["GITHUB_SHA"],
              "candidate_sha256": os.environ["CANDIDATE_SHA256"],
              "release_id": str(release["id"]),
              "asset_ids": {a["name"]: str(a["id"])
                            for a in release["assets"]},
              "tag": os.environ["FINAL_TAG"]},
              indent=2, sort_keys=True))
          EOF
          ./tools/candidate-custody import \
            --request request.json \
            --out custody-out \
            --harness-bin target/debug/memveil-release-entry
      - name: Upload the stored candidate
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          # Name pinned by the custody verifier: candidate-<digest>.
          name: candidate-${{ inputs.candidate_sha256 }}
          path: custody-out/stored
          if-no-files-found: error
          retention-days: 90
      - name: Attest the stored subjects
        uses: actions/attest@ce27ba3b4a9a139d9a20a4a07d69fabb52f1e5bc  # v2
        with:
          subject-path: custody-out/stored/*
          predicate-type: 'https://memveil.org/attestations/memveil-candidate-import/1'
          predicate: '{}'
      - name: Report the custody binding
        run: |
          set -eu
          sha256sum custody-out/stored/custody.json
          cat custody-out/SUBJECTS.txt

  dry-run:
    if: inputs.mode == 'dry-run'
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      actions: read
      attestations: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Validate dispatch inputs as data
        env:
          CANDIDATE_SHA256: ${{ inputs.candidate_sha256 }}
          SOURCE_COMMIT: ${{ inputs.source_commit }}
          IMPORT_RUN_ID: ${{ inputs.import_run_id }}
          IMPORT_ARTIFACT_ID: ${{ inputs.import_artifact_id }}
        run: |
          set -eu
          python3 - <<'EOF'
          import os
          import re
          import sys
          sha = os.environ.get("CANDIDATE_SHA256") or ""
          commit = os.environ.get("SOURCE_COMMIT") or ""
          if not re.fullmatch(r"[0-9a-f]{64}", sha):
              sys.exit("candidate_sha256 is not 64 lowercase hex")
          if not re.fullmatch(r"[0-9a-f]{40}", commit):
              sys.exit("source_commit is not 40 lowercase hex")
          run_id = os.environ.get("IMPORT_RUN_ID") or ""
          artifact_id = os.environ.get("IMPORT_ARTIFACT_ID") or ""
          if not re.fullmatch(r"[1-9][0-9]*", run_id):
              sys.exit("import_run_id is not a positive decimal ID")
          if not re.fullmatch(r"[1-9][0-9]*", artifact_id):
              sys.exit("import_artifact_id is not a positive decimal ID")
          EOF
          git cat-file -e "$SOURCE_COMMIT^{commit}"
      - name: Install custody tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cpio rpm
      - name: Build the verifier from the trusted checkout
        run: |
          set -eu
          curl -fsSL -o /tmp/rustup-init \
            https://static.rust-lang.org/rustup/dist/x86_64-unknown-linux-gnu/rustup-init
          curl -fsSL -o /tmp/rustup-init.sha256 \
            https://static.rust-lang.org/rustup/dist/x86_64-unknown-linux-gnu/rustup-init.sha256
          (cd /tmp && sha256sum --check rustup-init.sha256)
          chmod +x /tmp/rustup-init
          /tmp/rustup-init -y --profile minimal --default-toolchain none
          export PATH="$HOME/.cargo/bin:$PATH"
          rustup toolchain install 1.100.0 --profile minimal
          cargo fetch --locked
          cargo build -p memveil-release-entry --locked --offline
          test -x target/debug/memveil-release-entry
      - name: Validate the proposed tag without mutation
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CUSTODY_ARM: ARM-DRY-RUN
          GITHUB_EVENT_NAME: workflow_dispatch
          SOURCE_COMMIT: ${{ inputs.source_commit }}
          CANDIDATE_SHA256: ${{ inputs.candidate_sha256 }}
          IMPORT_RUN_ID: ${{ inputs.import_run_id }}
          IMPORT_ARTIFACT_ID: ${{ inputs.import_artifact_id }}
        run: |
          set -eu
          VERSION=$(git show "$SOURCE_COMMIT:Cargo.toml" \
            | grep -m1 '^version = ' | cut -d'"' -f2)
          test -n "$VERSION"
          export FINAL_TAG="v$VERSION"
          python3 - > request.json <<'EOF'
          import json, os
          print(json.dumps({
              "repository": os.environ["GITHUB_REPOSITORY"],
              "source_commit": os.environ["SOURCE_COMMIT"],
              "qualification_commit": os.environ["GITHUB_SHA"],
              "candidate_sha256": os.environ["CANDIDATE_SHA256"],
              "run_id": os.environ["IMPORT_RUN_ID"],
              "artifact_id": os.environ["IMPORT_ARTIFACT_ID"],
              "tag": os.environ["FINAL_TAG"]},
              indent=2, sort_keys=True))
          EOF
          ./tools/candidate-custody dry-run \
            --request request.json \
            --out custody-out \
            --harness-bin target/debug/memveil-release-entry

  promote:
    if: inputs.mode == 'promote' && inputs.promote_authorization == inputs.candidate_sha256
    runs-on: ubuntu-26.04
    permissions:
      contents: write
      actions: read
      checks: read
      attestations: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Validate dispatch inputs as data
        env:
          CANDIDATE_SHA256: ${{ inputs.candidate_sha256 }}
          SOURCE_COMMIT: ${{ inputs.source_commit }}
          IMPORT_RUN_ID: ${{ inputs.import_run_id }}
          IMPORT_ARTIFACT_ID: ${{ inputs.import_artifact_id }}
        run: |
          set -eu
          python3 - <<'EOF'
          import os
          import re
          import sys
          sha = os.environ.get("CANDIDATE_SHA256") or ""
          commit = os.environ.get("SOURCE_COMMIT") or ""
          if not re.fullmatch(r"[0-9a-f]{64}", sha):
              sys.exit("candidate_sha256 is not 64 lowercase hex")
          if not re.fullmatch(r"[0-9a-f]{40}", commit):
              sys.exit("source_commit is not 40 lowercase hex")
          run_id = os.environ.get("IMPORT_RUN_ID") or ""
          artifact_id = os.environ.get("IMPORT_ARTIFACT_ID") or ""
          if not re.fullmatch(r"[1-9][0-9]*", run_id):
              sys.exit("import_run_id is not a positive decimal ID")
          if not re.fullmatch(r"[1-9][0-9]*", artifact_id):
              sys.exit("import_artifact_id is not a positive decimal ID")
          EOF
          git cat-file -e "$SOURCE_COMMIT^{commit}"
      - name: Install custody tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cpio rpm
      - name: Build the verifier from the trusted checkout
        run: |
          set -eu
          curl -fsSL -o /tmp/rustup-init \
            https://static.rust-lang.org/rustup/dist/x86_64-unknown-linux-gnu/rustup-init
          curl -fsSL -o /tmp/rustup-init.sha256 \
            https://static.rust-lang.org/rustup/dist/x86_64-unknown-linux-gnu/rustup-init.sha256
          (cd /tmp && sha256sum --check rustup-init.sha256)
          chmod +x /tmp/rustup-init
          /tmp/rustup-init -y --profile minimal --default-toolchain none
          export PATH="$HOME/.cargo/bin:$PATH"
          rustup toolchain install 1.100.0 --profile minimal
          cargo fetch --locked
          cargo build -p memveil-release-entry --locked --offline
          test -x target/debug/memveil-release-entry
      - name: Publish the qualified release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CUSTODY_ARM: ARM-PROMOTE
          GITHUB_EVENT_NAME: workflow_dispatch
          SOURCE_COMMIT: ${{ inputs.source_commit }}
          CANDIDATE_SHA256: ${{ inputs.candidate_sha256 }}
          IMPORT_RUN_ID: ${{ inputs.import_run_id }}
          IMPORT_ARTIFACT_ID: ${{ inputs.import_artifact_id }}
        run: |
          set -eu
          VERSION=$(git show "$SOURCE_COMMIT:Cargo.toml" \
            | grep -m1 '^version = ' | cut -d'"' -f2)
          test -n "$VERSION"
          export FINAL_TAG="v$VERSION"
          python3 - > request.json <<'EOF'
          import json, os
          print(json.dumps({
              "repository": os.environ["GITHUB_REPOSITORY"],
              "source_commit": os.environ["SOURCE_COMMIT"],
              "qualification_commit": os.environ["GITHUB_SHA"],
              "candidate_sha256": os.environ["CANDIDATE_SHA256"],
              "run_id": os.environ["IMPORT_RUN_ID"],
              "artifact_id": os.environ["IMPORT_ARTIFACT_ID"],
              "tag": os.environ["FINAL_TAG"]},
              indent=2, sort_keys=True))
          EOF
          ./tools/candidate-custody promote \
            --request request.json \
            --out custody-out \
            --harness-bin target/debug/memveil-release-entry
