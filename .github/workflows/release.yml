# SPDX-License-Identifier: GPL-3.0-or-later
# Dispatch-only release pipeline: one mode per dispatch, each
# dispatch runs only its own stage and never rebuilds another
# stage's bytes. Mode to jobs:
#   seal    -> seal, sign, qualify (qualify only after the
#              holding draft exists; re-dispatch seal then)
#   import  -> import (consumes the sealed set via the draft
#              assets, stores the remote artifact, attests)
#   dry-run -> dry-run (consumes the recorded import only)
#   promote -> promote (consumes the recorded import only)
# Custody stages consume stored bytes with digest verification
# (sealed artifact, draft assets, remote artifact) and run
# zero builds of the candidate. Custody dispatches run with
# the workflow ref at the qualification commit Q (evidence-
# only over C); dry-run validates the proposed tag while it
# must not exist yet, so the owner creates the final tag on C
# after a green dry-run and only then dispatches promote.
# See RELEASING.md for the operator order.
#
# Two-checkout trust rule: every job checks out the trusted
# workflow ref for its tools and scripts, and jobs that need
# the candidate source materialize C as a data-only worktree
# (never executed, only read through --source-root/--root).
# Dispatch inputs are validated as data (digest pattern,
# 40-hex commit plus a git object check) before use, and
# digests are compared in Python, never interpolated into
# shell. Signing runs in its own job over trusted code plus
# sealed bytes only, away from the candidate build. Custody
# jobs build the verifier from the trusted checkout inside
# the job and never execute sealed bytes: the sealed set
# carries no executable harness.
#
# Toolchain pins, matching the tree: Rust 1.100.0 plus
# nightly-2026-05-20 for the eBPF child build
# (rust-toolchain.toml, build.rs BPF_TOOLCHAIN) and bpf-linker
# 0.10.4 (build.rs prerequisite).
name: release

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'Pipeline stage to run'
        required: true
        type: choice
        options: [seal, import, dry-run, promote]
      candidate_sha256:
        description: 'Sealed candidate digest to release'
        required: true
        type: string
      source_commit:
        description: 'Source commit C the candidate seals'
        required: true
        type: string
      promote_authorization:
        description: 'Retype candidate_sha256 to authorize publishing'
        required: false
        type: string
        default: ''
      import_run_id:
        description: 'Recorded import workflow run ID (consumers only)'
        required: false
        type: string
        default: ''
      import_artifact_id:
        description: 'Recorded import artifact ID (consumers only)'
        required: false
        type: string
        default: ''

permissions: {}

jobs:
  seal:
    if: inputs.mode == 'seal'
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          fetch-depth: 0
      - name: Validate dispatch inputs as data
        env:
          CANDIDATE_SHA256: ${{ inputs.candidate_sha256 }}
          SOURCE_COMMIT: ${{ inputs.source_commit }}
        run: |
          set -eu
          python3 - <<'EOF'
          import os
          import re
          import sys
          sha = os.environ.get("CANDIDATE_SHA256") or ""
          commit = os.environ.get("SOURCE_COMMIT") or ""
          if not re.fullmatch(r"[0-9a-f]{64}", sha):
              sys.exit("candidate_sha256 is not 64 lowercase hex")
          if not re.fullmatch(r"[0-9a-f]{40}", commit):
              sys.exit("source_commit is not 40 lowercase hex")
          EOF
          git cat-file -e "$SOURCE_COMMIT^{commit}"
      - name: Pin the sealed clock to C
        env:
          SOURCE_COMMIT: ${{ inputs.source_commit }}
        run: |
          set -eu
          EPOCH=$(git log -1 --format=%ct "$SOURCE_COMMIT")
          case "$EPOCH" in
            ""|*[!0-9]*)
              echo "not an epoch: $EPOCH" >&2; exit 1;;
          esac
          echo "SOURCE_DATE_EPOCH=$EPOCH" >> "$GITHUB_ENV"
      - name: Materialize the candidate source as data
        env:
          SOURCE_COMMIT: ${{ inputs.source_commit }}
        run: |
          set -eu
          git worktree add --detach candidate-src "$SOURCE_COMMIT"
          test "$(git -C candidate-src rev-parse HEAD)" \
            = "$SOURCE_COMMIT"
      - name: Install Rust toolchains
        run: |
          curl -fsSL -o /tmp/rustup-init \
            https://static.rust-lang.org/rustup/dist/x86_64-unknown-linux-gnu/rustup-init
          curl -fsSL -o /tmp/rustup-init.sha256 \
            https://static.rust-lang.org/rustup/dist/x86_64-unknown-linux-gnu/rustup-init.sha256
          (cd /tmp && sha256sum --check rustup-init.sha256)
          chmod +x /tmp/rustup-init
          /tmp/rustup-init -y --profile minimal --default-toolchain none
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          rustup toolchain install 1.100.0 --profile minimal
          rustup toolchain install nightly-2026-05-20 --profile minimal \
            --component rust-src
      - name: Install bpf-linker 0.10.4
        run: cargo install bpf-linker --version 0.10.4 --locked
      - name: Install packaging tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            binutils cpio dpkg-dev patchelf rpm
      - name: Warm the cargo cache for offline builds
        run: |
          cargo fetch --locked
          cargo fetch --locked --manifest-path crates/ebpf/Cargo.toml
      - name: Build the bundle, deb, and rpm
        run: |
          set -eu
          python3 scripts/package-tarball.py --build --candidate \
            --root candidate-src --out dist --tag bundle
          python3 scripts/package-deb.py --bundle dist/bundle --out dist/deb
          python3 scripts/package-rpm.py --work work/rpm --out dist/rpm \
            --bundle dist/bundle
          mkdir -p dist/artifacts
          cp dist/bundle.tar.gz dist/artifacts/
          set -- dist/deb/*.deb; test $# -eq 1 && test -f "$1"
          cp "$1" dist/artifacts/
          set -- dist/rpm/*.rpm; test $# -eq 1 && test -f "$1"
          cp "$1" dist/artifacts/
          git -C candidate-src archive --format=tar HEAD | gzip -n \
            > dist/artifacts/memveil-source.tar.gz
      - name: Emit the frozen SBOM
        run: |
          set -eu
          cargo build -p memveil-release-entry --locked --offline
          set -- dist/artifacts/*.deb; test $# -eq 1 && test -f "$1"
          DEB=$1
          set -- dist/artifacts/*.rpm; test $# -eq 1 && test -f "$1"
          RPM=$1
          target/debug/memveil-release-entry sbom-emit \
            --manifest dist/bundle/MANIFEST.json \
            --out dist/artifacts/memveil.spdx.json \
            --bundle dist/artifacts/bundle.tar.gz \
            --deb "$DEB" \
            --rpm "$RPM" \
            --lock candidate-src/Cargo.lock \
            --ebpf-lock candidate-src/crates/ebpf/Cargo.lock
      - name: Record provenance and seal
        env:
          CANDIDATE_SHA256: ${{ inputs.candidate_sha256 }}
        run: |
          set -eu
          set -- dist/artifacts/*.deb; test $# -eq 1 && test -f "$1"
          DEB=$1
          set -- dist/artifacts/*.rpm; test $# -eq 1 && test -f "$1"
          RPM=$1
          ./tools/candidate provenance \
            --bundle-dir dist/bundle \
            --bundle dist/artifacts/bundle.tar.gz \
            --deb "$DEB" \
            --rpm "$RPM" \
            --source dist/artifacts/memveil-source.tar.gz \
            --sbom dist/artifacts/memveil.spdx.json \
            --out dist/artifacts/memveil.provenance.json \
            --source-root candidate-src
          ./tools/candidate seal \
            --bundle-dir dist/bundle \
            --artifacts-dir dist/artifacts \
            --policy candidate-src/packaging/candidate-policy.json \
            --out candidate.json \
            --source-root candidate-src
          python3 - candidate.json <<'EOF'
          import hashlib
          import os
          import sys
          with open(sys.argv[1], "rb") as stream:
              got = hashlib.sha256(stream.read()).hexdigest()
          if got != os.environ["CANDIDATE_SHA256"]:
              sys.exit("sealed digest differs from dispatched candidate")
          EOF
      - name: Stage the unsigned sealed set
        run: |
          set -eu
          rm -rf sealed && mkdir sealed
          cp candidate.json sealed/
          cp dist/artifacts/* sealed/
          set -- sealed/*; test $# -eq 7
          ls sealed
      - name: Upload the unsigned sealed candidate
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: sealed-unsigned-${{ inputs.candidate_sha256 }}
          path: sealed/
          if-no-files-found: error
          retention-days: 90

  sign:
    needs: seal
    if: inputs.mode == 'seal'
    runs-on: ubuntu-26.04
    outputs:
      present: ${{ steps.draft.outputs.present }}
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - name: Validate the candidate digest as data
        env:
          CANDIDATE_SHA256: ${{ inputs.candidate_sha256 }}
        run: |
          set -eu
          python3 - <<'EOF'
          import os
          import re
          import sys
          sha = os.environ.get("CANDIDATE_SHA256") or ""
          if not re.fullmatch(r"[0-9a-f]{64}", sha):
              sys.exit("candidate_sha256 is not 64 lowercase hex")
          EOF
      - name: Sign the sealed artifact checksums
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CANDIDATE_SHA256: ${{ inputs.candidate_sha256 }}
          QUALIFIER_SIGNING_KEY: ${{ secrets.QUALIFIER_SIGNING_KEY }}
        run: |
          set -eu
          gh run download "$GITHUB_RUN_ID" \
            -n "sealed-unsigned-$CANDIDATE_SHA256" -D sealed-unsigned
          set -- sealed-unsigned/*; test $# -eq 7
          python3 - sealed-unsigned/candidate.json <<'EOF'
          import hashlib
          import os
          import sys
          with open(sys.argv[1], "rb") as stream:
              got = hashlib.sha256(stream.read()).hexdigest()
          if got != os.environ["CANDIDATE_SHA256"]:
              sys.exit("sealed digest differs from dispatched candidate")
          EOF
          python3 - sealed-unsigned/candidate.json sealed-unsigned \
            sign-input <<'EOF'
          import json
          import shutil
          import sys
          from pathlib import Path
          manifest = json.loads(Path(sys.argv[1]).read_bytes())
          src = Path(sys.argv[2])
          dest = Path(sys.argv[3])
          dest.mkdir()
          names = sorted(entry["name"]
                         for entry in manifest["artifacts"])
          if len(names) != 6:
              sys.exit("sealed set holds no six artifacts")
          for name in names:
              if "/" in name:
                  sys.exit("invalid sealed artifact name")
              shutil.copy2(src / name, dest / name)
          EOF
          test -n "$QUALIFIER_SIGNING_KEY"
          umask 077
          printf '%s\n' "$QUALIFIER_SIGNING_KEY" > qualifier.key
          ./tools/candidate sign-checksums \
            --artifacts-dir sign-input \
            --key qualifier.key \
            --out-dir dist/signed
          rm -f qualifier.key
      - name: Stage the sealed set
        run: |
          set -eu
          rm -rf sealed && mkdir sealed
          cp sealed-unsigned/candidate.json sealed/
          cp sign-input/* sealed/
          cp dist/signed/SHA256SUMS.txt dist/signed/SHA256SUMS.txt.sig \
            dist/signed/signer.pub sealed/
          set -- sealed/*; test $# -eq 10
          ls sealed
      - name: Upload the sealed candidate
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: sealed-${{ inputs.candidate_sha256 }}
          path: sealed/
          if-no-files-found: error
          retention-days: 90
      - name: Check for the holding draft
        id: draft
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CANDIDATE_SHA256: ${{ inputs.candidate_sha256 }}
        run: |
          if gh api \
            "repos/$GITHUB_REPOSITORY/releases/tags/candidate-$CANDIDATE_SHA256" \
            >/dev/null 2>&1; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi

  qualify:
    needs: [seal, sign]
    if: inputs.mode == 'seal' && needs.sign.outputs.present == 'true'
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          fetch-depth: 0
      - name: Validate dispatch inputs as data
        env:
          CANDIDATE_SHA256: ${{ inputs.candidate_sha256 }}
          SOURCE_COMMIT: ${{ inputs.source_commit }}
        run: |
          set -eu
          python3 - <<'EOF'
          import os
          import re
          import sys
          sha = os.environ.get("CANDIDATE_SHA256") or ""
          commit = os.environ.get("SOURCE_COMMIT") or ""
          if not re.fullmatch(r"[0-9a-f]{64}", sha):
              sys.exit("candidate_sha256 is not 64 lowercase hex")
          if not re.fullmatch(r"[0-9a-f]{40}", commit):
              sys.exit("source_commit is not 40 lowercase hex")
          EOF
          git cat-file -e "$SOURCE_COMMIT^{commit}"
      - name: Materialize the candidate source as data
        env:
          SOURCE_COMMIT: ${{ inputs.source_commit }}
        run: |
          set -eu
          git worktree add --detach candidate-src "$SOURCE_COMMIT"
          test "$(git -C candidate-src rev-parse HEAD)" \
            = "$SOURCE_COMMIT"
      - name: Install matrix tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cpio rpm
      - name: Collect the candidate and the campaign evidence
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CANDIDATE_SHA256: ${{ inputs.candidate_sha256 }}
        run: |
          set -eu
          gh run download "$GITHUB_RUN_ID" \
            -n "sealed-$CANDIDATE_SHA256" -D sealed
          python3 - sealed/candidate.json <<'EOF'
          import hashlib
          import os
          import sys
          with open(sys.argv[1], "rb") as stream:
              got = hashlib.sha256(stream.read()).hexdigest()
          if got != os.environ["CANDIDATE_SHA256"]:
              sys.exit("sealed digest differs from dispatched candidate")
          EOF
          mkdir -p evidence-dl
          gh release download \
            "candidate-$CANDIDATE_SHA256" \
            -p qualification-evidence.tar.gz -D evidence-dl
          python3 - evidence-dl/qualification-evidence.tar.gz \
            evidence <<'EOF'
          import sys
          sys.path.insert(0, "tools")
          import candidate
          from pathlib import Path
          candidate.safe_extract(sys.argv[1], Path(sys.argv[2]),
                                 True, False)
          EOF
          cp sealed/SHA256SUMS.txt sealed/SHA256SUMS.txt.sig \
            sealed/signer.pub evidence/
      - name: Qualify and export the tested payload
        run: |
          set -eu
          ./tools/candidate qualify \
            --manifest sealed/candidate.json \
            --qualification evidence/qualification.json \
            --policy candidate-src/packaging/candidate-policy.json \
            --evidence-dir evidence \
            --source-tree candidate-src
          # Derived only after the qualify gate above
          # authenticated the same bytes; the export branch below
          # authenticates them once more before evaluating them.
          MATRIX_DIR=$(python3 - evidence \
            evidence/qualification.json <<'EOF'
          import sys
          sys.path.insert(0, "tools")
          import candidate
          from pathlib import Path
          evidence = Path(sys.argv[1])
          doc = candidate.read_json(sys.argv[2], sealed=True)
          gate = doc["gates"][candidate.MATRIX_GATE]
          record = candidate.read_json(
              evidence / candidate.relative(gate["receipt"]),
              sealed=True)
          inputs = candidate.read_json(
              evidence / candidate.relative(record["inputs"]),
              sealed=True)
          print(inputs["matrix_directory"])
          EOF
          )
          test -n "$MATRIX_DIR"
          MV_CANDIDATE_MANIFEST=sealed/candidate.json \
          ./tools/kernel-matrix \
            --verify-out \
            --out "evidence/$MATRIX_DIR" \
            --export-tested tested-payload.sha256 \
            --lock candidate-src/tests/vm/kernels.lock.json \
            --evidence-dir evidence \
            --qualification evidence/qualification.json \
            --policy candidate-src/packaging/candidate-policy.json \
            --source-tree candidate-src
      - name: Upload the tested payload
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: tested-${{ inputs.candidate_sha256 }}
          path: tested-payload.sha256
          if-no-files-found: error
          retention-days: 90

  import:
    if: inputs.mode == 'import'
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      actions: write
      attestations: write
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          fetch-depth: 0
      - name: Validate dispatch inputs as data
        env:
          CANDIDATE_SHA256: ${{ inputs.candidate_sha256 }}
          SOURCE_COMMIT: ${{ inputs.source_commit }}
        run: |
          set -eu
          python3 - <<'EOF'
          import os
          import re
          import sys
          sha = os.environ.get("CANDIDATE_SHA256") or ""
          commit = os.environ.get("SOURCE_COMMIT") or ""
          if not re.fullmatch(r"[0-9a-f]{64}", sha):
              sys.exit("candidate_sha256 is not 64 lowercase hex")
          if not re.fullmatch(r"[0-9a-f]{40}", commit):
              sys.exit("source_commit is not 40 lowercase hex")
          EOF
          git cat-file -e "$SOURCE_COMMIT^{commit}"
      - name: Install custody tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cpio rpm
      - name: Build the verifier from the trusted checkout
        run: |
          set -eu
          curl -fsSL -o /tmp/rustup-init \
            https://static.rust-lang.org/rustup/dist/x86_64-unknown-linux-gnu/rustup-init
          curl -fsSL -o /tmp/rustup-init.sha256 \
            https://static.rust-lang.org/rustup/dist/x86_64-unknown-linux-gnu/rustup-init.sha256
          (cd /tmp && sha256sum --check rustup-init.sha256)
          chmod +x /tmp/rustup-init
          /tmp/rustup-init -y --profile minimal --default-toolchain none
          export PATH="$HOME/.cargo/bin:$PATH"
          rustup toolchain install 1.100.0 --profile minimal
          cargo fetch --locked
          cargo build -p memveil-release-entry --locked --offline
          test -x target/debug/memveil-release-entry
      - name: Import the holding draft
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CUSTODY_ARM: ARM-IMPORT
          GITHUB_EVENT_NAME: workflow_dispatch
          SOURCE_COMMIT: ${{ inputs.source_commit }}
          CANDIDATE_SHA256: ${{ inputs.candidate_sha256 }}
        run: |
          set -eu
          VERSION=$(git show "$SOURCE_COMMIT:Cargo.toml" \
            | grep -m1 '^version = ' | cut -d'"' -f2)
          test -n "$VERSION"
          export FINAL_TAG="v$VERSION"
          gh api \
            "repos/$GITHUB_REPOSITORY/releases/tags/candidate-$CANDIDATE_SHA256" \
            > release.json
          python3 - release.json > request.json <<'EOF'
          import json, os, sys
          release = json.load(open(sys.argv[1]))
          print(json.dumps({
              "repository": os.environ["GITHUB_REPOSITORY"],
              "source_commit": os.environ["SOURCE_COMMIT"],
              "qualification_commit": os.environ["GITHUB_SHA"],
              "candidate_sha256": os.environ["CANDIDATE_SHA256"],
              "release_id": str(release["id"]),
              "asset_ids": {a["name"]: str(a["id"])
                            for a in release["assets"]},
              "tag": os.environ["FINAL_TAG"]},
              indent=2, sort_keys=True))
          EOF
          ./tools/candidate-custody import \
            --request request.json \
            --out custody-out \
            --harness-bin target/debug/memveil-release-entry
      - name: Upload the stored candidate
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          # Name pinned by the custody verifier: candidate-<digest>.
          name: candidate-${{ inputs.candidate_sha256 }}
          path: custody-out/stored
          if-no-files-found: error
          retention-days: 90
      - name: Attest the stored subjects
        uses: actions/attest@ce27ba3b4a9a139d9a20a4a07d69fabb52f1e5bc  # v2
        with:
          subject-path: custody-out/stored/*
          predicate-type: 'https://memveil.org/attestations/memveil-candidate-import/1'
          predicate: '{}'
      - name: Report the custody binding
        run: |
          set -eu
          sha256sum custody-out/stored/custody.json
          cat custody-out/SUBJECTS.txt

  dry-run:
    if: inputs.mode == 'dry-run'
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      actions: read
      attestations: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          fetch-depth: 0
      - name: Validate dispatch inputs as data
        env:
          CANDIDATE_SHA256: ${{ inputs.candidate_sha256 }}
          SOURCE_COMMIT: ${{ inputs.source_commit }}
          IMPORT_RUN_ID: ${{ inputs.import_run_id }}
          IMPORT_ARTIFACT_ID: ${{ inputs.import_artifact_id }}
        run: |
          set -eu
          python3 - <<'EOF'
          import os
          import re
          import sys
          sha = os.environ.get("CANDIDATE_SHA256") or ""
          commit = os.environ.get("SOURCE_COMMIT") or ""
          if not re.fullmatch(r"[0-9a-f]{64}", sha):
              sys.exit("candidate_sha256 is not 64 lowercase hex")
          if not re.fullmatch(r"[0-9a-f]{40}", commit):
              sys.exit("source_commit is not 40 lowercase hex")
          run_id = os.environ.get("IMPORT_RUN_ID") or ""
          artifact_id = os.environ.get("IMPORT_ARTIFACT_ID") or ""
          if not re.fullmatch(r"[1-9][0-9]*", run_id):
              sys.exit("import_run_id is not a positive decimal ID")
          if not re.fullmatch(r"[1-9][0-9]*", artifact_id):
              sys.exit("import_artifact_id is not a positive decimal ID")
          EOF
          git cat-file -e "$SOURCE_COMMIT^{commit}"
      - name: Install custody tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cpio rpm
      - name: Build the verifier from the trusted checkout
        run: |
          set -eu
          curl -fsSL -o /tmp/rustup-init \
            https://static.rust-lang.org/rustup/dist/x86_64-unknown-linux-gnu/rustup-init
          curl -fsSL -o /tmp/rustup-init.sha256 \
            https://static.rust-lang.org/rustup/dist/x86_64-unknown-linux-gnu/rustup-init.sha256
          (cd /tmp && sha256sum --check rustup-init.sha256)
          chmod +x /tmp/rustup-init
          /tmp/rustup-init -y --profile minimal --default-toolchain none
          export PATH="$HOME/.cargo/bin:$PATH"
          rustup toolchain install 1.100.0 --profile minimal
          cargo fetch --locked
          cargo build -p memveil-release-entry --locked --offline
          test -x target/debug/memveil-release-entry
      - name: Validate the proposed tag without mutation
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CUSTODY_ARM: ARM-DRY-RUN
          GITHUB_EVENT_NAME: workflow_dispatch
          SOURCE_COMMIT: ${{ inputs.source_commit }}
          CANDIDATE_SHA256: ${{ inputs.candidate_sha256 }}
          IMPORT_RUN_ID: ${{ inputs.import_run_id }}
          IMPORT_ARTIFACT_ID: ${{ inputs.import_artifact_id }}
        run: |
          set -eu
          VERSION=$(git show "$SOURCE_COMMIT:Cargo.toml" \
            | grep -m1 '^version = ' | cut -d'"' -f2)
          test -n "$VERSION"
          export FINAL_TAG="v$VERSION"
          python3 - > request.json <<'EOF'
          import json, os
          print(json.dumps({
              "repository": os.environ["GITHUB_REPOSITORY"],
              "source_commit": os.environ["SOURCE_COMMIT"],
              "qualification_commit": os.environ["GITHUB_SHA"],
              "candidate_sha256": os.environ["CANDIDATE_SHA256"],
              "run_id": os.environ["IMPORT_RUN_ID"],
              "artifact_id": os.environ["IMPORT_ARTIFACT_ID"],
              "tag": os.environ["FINAL_TAG"]},
              indent=2, sort_keys=True))
          EOF
          ./tools/candidate-custody dry-run \
            --request request.json \
            --out custody-out \
            --harness-bin target/debug/memveil-release-entry

  promote:
    if: inputs.mode == 'promote' && inputs.promote_authorization == inputs.candidate_sha256
    runs-on: ubuntu-26.04
    permissions:
      contents: write
      actions: read
      attestations: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          fetch-depth: 0
      - name: Validate dispatch inputs as data
        env:
          CANDIDATE_SHA256: ${{ inputs.candidate_sha256 }}
          SOURCE_COMMIT: ${{ inputs.source_commit }}
          IMPORT_RUN_ID: ${{ inputs.import_run_id }}
          IMPORT_ARTIFACT_ID: ${{ inputs.import_artifact_id }}
        run: |
          set -eu
          python3 - <<'EOF'
          import os
          import re
          import sys
          sha = os.environ.get("CANDIDATE_SHA256") or ""
          commit = os.environ.get("SOURCE_COMMIT") or ""
          if not re.fullmatch(r"[0-9a-f]{64}", sha):
              sys.exit("candidate_sha256 is not 64 lowercase hex")
          if not re.fullmatch(r"[0-9a-f]{40}", commit):
              sys.exit("source_commit is not 40 lowercase hex")
          run_id = os.environ.get("IMPORT_RUN_ID") or ""
          artifact_id = os.environ.get("IMPORT_ARTIFACT_ID") or ""
          if not re.fullmatch(r"[1-9][0-9]*", run_id):
              sys.exit("import_run_id is not a positive decimal ID")
          if not re.fullmatch(r"[1-9][0-9]*", artifact_id):
              sys.exit("import_artifact_id is not a positive decimal ID")
          EOF
          git cat-file -e "$SOURCE_COMMIT^{commit}"
      - name: Install custody tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cpio rpm
      - name: Build the verifier from the trusted checkout
        run: |
          set -eu
          curl -fsSL -o /tmp/rustup-init \
            https://static.rust-lang.org/rustup/dist/x86_64-unknown-linux-gnu/rustup-init
          curl -fsSL -o /tmp/rustup-init.sha256 \
            https://static.rust-lang.org/rustup/dist/x86_64-unknown-linux-gnu/rustup-init.sha256
          (cd /tmp && sha256sum --check rustup-init.sha256)
          chmod +x /tmp/rustup-init
          /tmp/rustup-init -y --profile minimal --default-toolchain none
          export PATH="$HOME/.cargo/bin:$PATH"
          rustup toolchain install 1.100.0 --profile minimal
          cargo fetch --locked
          cargo build -p memveil-release-entry --locked --offline
          test -x target/debug/memveil-release-entry
      - name: Publish the qualified release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CUSTODY_ARM: ARM-PROMOTE
          GITHUB_EVENT_NAME: workflow_dispatch
          SOURCE_COMMIT: ${{ inputs.source_commit }}
          CANDIDATE_SHA256: ${{ inputs.candidate_sha256 }}
          IMPORT_RUN_ID: ${{ inputs.import_run_id }}
          IMPORT_ARTIFACT_ID: ${{ inputs.import_artifact_id }}
        run: |
          set -eu
          VERSION=$(git show "$SOURCE_COMMIT:Cargo.toml" \
            | grep -m1 '^version = ' | cut -d'"' -f2)
          test -n "$VERSION"
          export FINAL_TAG="v$VERSION"
          python3 - > request.json <<'EOF'
          import json, os
          print(json.dumps({
              "repository": os.environ["GITHUB_REPOSITORY"],
              "source_commit": os.environ["SOURCE_COMMIT"],
              "qualification_commit": os.environ["GITHUB_SHA"],
              "candidate_sha256": os.environ["CANDIDATE_SHA256"],
              "run_id": os.environ["IMPORT_RUN_ID"],
              "artifact_id": os.environ["IMPORT_ARTIFACT_ID"],
              "tag": os.environ["FINAL_TAG"]},
              indent=2, sort_keys=True))
          EOF
          ./tools/candidate-custody promote \
            --request request.json \
            --out custody-out \
            --harness-bin target/debug/memveil-release-entry
