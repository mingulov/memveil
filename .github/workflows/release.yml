# SPDX-License-Identifier: GPL-3.0-or-later
# Release: tag-triggered artifact build and GitHub Release
# publication. A tag `vX.Y.Z` (or a manual dispatch dry run)
# provisions the locked toolchain exactly like the tier
# workflows, runs the Tier 1 + Tier 2 gate suites, builds
# the owner bundle, the .deb, and the .rpm from the clean
# tag tree, re-verifies each artifact through its own lane,
# and uploads the set plus the SBOM and a sha256 file to
# the tag's GitHub Release. Dispatch runs build everything,
# keep the set as a workflow artifact and publish nothing;
# both refuse a package set whose payload (binary, bridge,
# BPF objects) is not the committed tested one, and both
# attest build provenance for the published files. Rollback
# is a new tag; a rerun of the same tag fails instead of
# replacing uploaded files. v0.* and hyphenated tags
# publish as prereleases with the committed release notes.
name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write
  id-token: write
  attestations: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - name: Install pixi
        run: |
          python3 tools/install-pixi --prefix "$HOME/.pixi"
          echo "$HOME/.pixi/bin" >> "$GITHUB_PATH"
      - name: Install system toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang llvm bpftool cmake ninja-build python3-pytest \
            strace patchelf rpm binutils cpio python3
      - name: Provision libbpf-mojo tarball
        run: |
          VER="$(python3 -c "import json; print(json.load(open('toolchain.lock.json'))['dependencies']['libbpf-mojo']['version'])")"
          TARBALL="third_party/libbpf-mojo-$VER.tar.gz"
          WANT="$(python3 -c "import json; print(json.load(open('toolchain.lock.json'))['dependencies']['libbpf-mojo']['tarball_sha256'])")"
          echo "$WANT  $TARBALL" | sha256sum --check -
          echo "LMB_PACKAGE=$GITHUB_WORKSPACE/$TARBALL" >> "$GITHUB_ENV"
      - name: Build
        run: ./tools/build
      - name: Tag matches engine version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          ENGINE="$(./build/memveil version)"
          WANT="v${ENGINE#memveil-}"
          if [ "$TAG" != "$WANT" ]; then
            echo "tag $TAG does not match engine $ENGINE" >&2
            exit 1
          fi
      - name: Gate suites (Tier 1)
        run: |
          for suite in schemas unit reports profiles doctor qualify \
              identity correlation mappings lifetimes pools \
              regions conversion-normalize confidential-hooks \
              region-resolution baseline confidential-inventory \
              diagnostics top oracle-ledger profile-semantics \
              stop budgets quality reader-adversarial \
              fuzz-smoke fuzz-campaign record-failures \
              output-paths privacy render-escaping \
              offline-environment perf-replay preview-package \
              provenance docs examples package payload-gate sbom \
              source-export release-runtime; do
            ./tools/test "$suite" || exit 1
          done
      - name: Gate suites (Tier 2)
        run: |
          for suite in attempts native-decode writer signals record buildcache; do
            ./tools/test "$suite" || exit 1
          done
      - name: Build bundle
        run: ./tools/package
      - name: Build deb
        run: |
          ./tools/package-deb
          MV_DEB="$(echo "$GITHUB_WORKSPACE"/dist/memveil_*-1_amd64.deb)" ./tools/test deb || exit 1
      - name: Build rpm
        run: |
          ./tools/build-rpm --work "$GITHUB_WORKSPACE/dist" \
            --out "$GITHUB_WORKSPACE/dist" || exit 1
          MV_RPM="$(echo "$GITHUB_WORKSPACE"/dist/memveil-*.rpm)" \
            ./tools/test rpm-journey || exit 1
      - name: Verify bundle runtime
        run: |
          MV_BUNDLE_TARBALL="$(echo dist/memveil-*.tar.gz)" \
            ./tools/test release-runtime || exit 1
      # Every package must carry the payload the qualifying
      # lanes ran; the committed receipt pins all three sets.
      - name: Packaged payload is the tested one
        run: |
          ./tools/payload-gate --collect \
            --deb "$(echo dist/memveil_*-1_amd64.deb)" \
            --rpm "$(echo dist/memveil-*.rpm)" \
            --bundle "$(echo dist/memveil-*.tar.gz)" \
            --out dist/PACKAGED-SHA256.txt || exit 1
          ./tools/payload-gate --check \
            --packaged dist/PACKAGED-SHA256.txt \
            --tested packaging/tested-payload.sha256 || exit 1
      - name: SBOM
        run: |
          ./tools/sbom \
            --bundle "$(echo dist/memveil-*.tar.gz)" \
            --deb "$(echo dist/memveil_*-1_amd64.deb)" \
            --rpm "$(echo dist/memveil-*.rpm)" \
            --lock toolchain.lock.json \
            --out dist/memveil.spdx.json || exit 1
      - name: Checksums
        run: |
          cd dist
          sha256sum memveil-*.tar.gz memveil_*.deb memveil-*.rpm \
            memveil.spdx.json PACKAGED-SHA256.txt \
            > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - name: Attest build provenance
        uses: actions/attest-build-provenance@96278af6caaf10aea03fd8d33a09a777ca52d62f  # v3.2.0
        with:
          subject-path: |
            dist/memveil-*.tar.gz
            dist/memveil_*.deb
            dist/memveil-*.rpm
            dist/memveil.spdx.json
            dist/SHA256SUMS.txt
            dist/PACKAGED-SHA256.txt
      - name: Upload dry-run artifacts
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: release-dry-run
          path: |
            dist/memveil-*.tar.gz
            dist/memveil_*.deb
            dist/memveil-*.rpm
            dist/memveil.spdx.json
            dist/SHA256SUMS.txt
            dist/PACKAGED-SHA256.txt
          if-no-files-found: error
      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          PRE=""
          case "$TAG" in
            v0.*|*-*) PRE="--prerelease";;
          esac
          if gh release view "$TAG" >/dev/null 2>&1; then
            HAVE="$(gh release view "$TAG" --json assets \
              --jq '.assets | length')"
            if [ "$HAVE" != "0" ]; then
              echo "refusing to overwrite $HAVE published assets" >&2
              exit 1
            fi
          else
            # shellcheck disable=SC2086
            gh release create "$TAG" --title "$TAG" $PRE \
              --notes-file docs/release-notes.md
          fi
          gh release upload "$TAG" \
            dist/memveil-*.tar.gz dist/memveil_*.deb \
            dist/memveil-*.rpm dist/memveil.spdx.json \
            dist/SHA256SUMS.txt dist/PACKAGED-SHA256.txt
