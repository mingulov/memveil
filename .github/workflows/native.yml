# SPDX-License-Identifier: GPL-3.0-or-later
# Tier 2: native and FFI suites. Needs system clang for the C
# eBPF programs and native fixtures. Unprivileged; safe for
# pull requests. Sanitizer builds run here once the native
# fixtures adopt them.
#
# Same provisioning as Tier 1: the locked ubuntu-26.04
# toolchain generations, apt system tools, and the vendored
# pinned libbpf-mojo tarball via LMB_PACKAGE (hash-checked
# here and re-verified by the build). The record and
# buildcache lanes need the bridge; they fail loudly without
# it instead of skipping silently.
name: native

on:
  push:
  pull_request:

jobs:
  native:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v4
      - name: Install pixi
        run: |
          curl -fsSL https://pixi.sh/install.sh | \
            PIXI_VERSION=0.81.0 bash
          echo "$HOME/.pixi/bin" >> "$GITHUB_PATH"
      - name: Install system toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang bpftool cmake ninja-build
      - name: Provision libbpf-mojo tarball
        run: |
          VER="$(python3 -c "import json; print(json.load(open('toolchain.lock.json'))['dependencies']['libbpf-mojo']['version'])")"
          TARBALL="third_party/libbpf-mojo-$VER.tar.gz"
          WANT="$(python3 -c "import json; print(json.load(open('toolchain.lock.json'))['dependencies']['libbpf-mojo']['tarball_sha256'])")"
          echo "$WANT  $TARBALL" | sha256sum --check -
          echo "LMB_PACKAGE=$GITHUB_WORKSPACE/$TARBALL" >> "$GITHUB_ENV"
      - name: Build
        run: ./tools/build
      - name: Native suites
        run: |
          for suite in attempts native-decode writer signals record buildcache; do
            ./tools/test "$suite" || exit 1
          done
