# SPDX-License-Identifier: GPL-3.0-or-later
# Tier 2: native and FFI suites. Needs the system clang
# toolchain for the C eBPF programs and native fixtures.
# Unprivileged; safe for pull requests.
#
# Tier meanings, shared with the offline workflow: Tier 1
# is the unprivileged offline suites (no privileges, no
# network fixtures, no secrets; safe for pull requests
# from any source); Tier 2 is this workflow; Tier 3 is
# the confidential gates needing armed live kernels
# (confidential-ranges, confidential-real,
# confidential-late-attach), which no workflow schedules
# and which exit 77 unarmed. The vm-*, perf-workload,
# and soak suites run under the manual vm workflow on a
# trusted self-hosted runner; deb, rpm-journey, and
# extracted-robustness run on demand, not in CI.
#
# Same provisioning as Tier 1: the locked ubuntu-26.04
# toolchain generations, apt system tools, and the vendored
# pinned libbpf-mojo tarball via LMB_PACKAGE (hash-checked
# here and re-verified by the build). The record and
# buildcache lanes need the bridge; they fail loudly without
# it instead of skipping silently.
name: native

on:
  push:
  pull_request:

jobs:
  native:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - name: Install pixi
        run: |
          python3 tools/install-pixi --prefix "$HOME/.pixi"
          echo "$HOME/.pixi/bin" >> "$GITHUB_PATH"
      - name: Install system toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang llvm bpftool cmake ninja-build
      - name: Provision libbpf-mojo tarball
        run: |
          VER="$(python3 -c "import json; print(json.load(open('toolchain.lock.json'))['dependencies']['libbpf-mojo']['version'])")"
          TARBALL="third_party/libbpf-mojo-$VER.tar.gz"
          WANT="$(python3 -c "import json; print(json.load(open('toolchain.lock.json'))['dependencies']['libbpf-mojo']['tarball_sha256'])")"
          echo "$WANT  $TARBALL" | sha256sum --check -
          echo "LMB_PACKAGE=$GITHUB_WORKSPACE/$TARBALL" >> "$GITHUB_ENV"
      - name: Build
        run: ./tools/build
      - name: Native suites
        run: |
          for suite in attempts native-decode writer signals record buildcache; do
            ./tools/test "$suite" || exit 1
          done
