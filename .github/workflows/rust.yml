# SPDX-License-Identifier: GPL-3.0-or-later
# Rust gates: supply-chain policy (cargo-deny over the root
# and eBPF manifests), the full workspace test suite, and the
# audited offline pytest selection
# (tests/pytest-ci-selection.json).
# Unprivileged; safe for pull requests.
#
# Toolchain pins, matching the tree: Rust 1.100.0 plus
# nightly-2026-05-20 for the eBPF child build
# (rust-toolchain.toml, build.rs BPF_TOOLCHAIN),
# bpf-linker 0.10.4 (build.rs prerequisite),
# cargo-deny 0.21.0 (validated in-tree: see the eBPF
# deny.toml comment). The advisory DB needs network.
name: rust

on:
  push:
  pull_request:

jobs:
  deny:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - name: Install Rust 1.100.0 (cargo metadata only, no build)
        run: |
          curl -fsSL -o /tmp/rustup-init \
            https://static.rust-lang.org/rustup/dist/x86_64-unknown-linux-gnu/rustup-init
          curl -fsSL -o /tmp/rustup-init.sha256 \
            https://static.rust-lang.org/rustup/dist/x86_64-unknown-linux-gnu/rustup-init.sha256
          (cd /tmp && sha256sum --check rustup-init.sha256)
          chmod +x /tmp/rustup-init
          /tmp/rustup-init -y --profile minimal --default-toolchain none
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          rustup toolchain install 1.100.0 --profile minimal
      - name: Install cargo-deny 0.21.0
        run: |
          VER=0.21.0
          TARBALL="cargo-deny-$VER-x86_64-unknown-linux-musl.tar.gz"
          curl -fsSL -o /tmp/deny.tar.gz \
            "https://github.com/EmbarkStudios/cargo-deny/releases/download/$VER/$TARBALL"
          echo "a2170b854ff697e79e39c4c538981c9c1bdd803addbae6719a4cb66b4585a903  /tmp/deny.tar.gz" | sha256sum --check -
          mkdir -p /tmp/deny-dist
          tar -xzf /tmp/deny.tar.gz -C /tmp/deny-dist
          echo "/tmp/deny-dist/cargo-deny-$VER-x86_64-unknown-linux-musl" >> "$GITHUB_PATH"
          /tmp/deny-dist/cargo-deny-$VER-x86_64-unknown-linux-musl/cargo-deny --version
      - name: Check root manifest
        run: |
          cargo-deny check
      - name: Check eBPF manifest
        run: |
          cd crates/ebpf && cargo-deny check

  rust-test:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            binutils cpio file patchelf python3-jsonschema rpm \
            zsh
          # Slim images exclude docs/man at install time; real
          # installs ship them, so clear the exclusion to prove
          # the full .deb payload in the install journey.
          sudo rm -f /etc/dpkg/dpkg.cfg.d/excludes
      - name: Install Rust toolchains
        run: |
          curl -fsSL -o /tmp/rustup-init \
            https://static.rust-lang.org/rustup/dist/x86_64-unknown-linux-gnu/rustup-init
          curl -fsSL -o /tmp/rustup-init.sha256 \
            https://static.rust-lang.org/rustup/dist/x86_64-unknown-linux-gnu/rustup-init.sha256
          (cd /tmp && sha256sum --check rustup-init.sha256)
          chmod +x /tmp/rustup-init
          /tmp/rustup-init -y --profile minimal --default-toolchain none
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          rustup toolchain install 1.100.0 --profile minimal \
            --component clippy,rustfmt
          rustup toolchain install nightly-2026-05-20 --profile minimal \
            --component rust-src
      - name: Install bpf-linker 0.10.4
        run: cargo install bpf-linker --version 0.10.4 --locked
      - name: Warm the cargo cache for offline queries
        run: |
          cargo fetch --locked
          cargo fetch --locked --manifest-path crates/ebpf/Cargo.toml
      - name: Restore stock /usr/share permissions
        run: |
          # The runner image ships /usr/share with mode 777 plus
          # default ACLs on many subdirs. Files the rpm installs
          # under them inherit those ACLs, and rpm 6 verify reports
          # the unexpected ACLs as mode (.M) differences even though
          # the numeric modes match. Strip default ACLs under
          # /usr/share and restore stock top-level modes so the
          # install journey verifies like on a real system.
          echo "--- before ---"
          stat -c '%a %n' /usr/share /usr/share/doc
          echo "default-ACL entries under /usr/share: $(getfacl -R -p /usr/share 2>/dev/null | grep -c '^default:' || true)"
          sudo find /usr/share -type d -exec setfacl -k {} +
          sudo setfacl -b /usr/share /usr/share/doc
          sudo chmod 755 /usr/share /usr/share/doc
          echo "--- after ---"
          stat -c '%a %n' /usr/share /usr/share/doc
          REMAIN=$(getfacl -R -p /usr/share 2>/dev/null | grep -c '^default:' || true)
          echo "default-ACL entries remaining under /usr/share: $REMAIN"
          test "$REMAIN" -eq 0 || echo "WARNING: default ACLs remain"
      - name: Run Rust test suite
        run: |
          cargo test --workspace --locked
      - name: Diagnose package verify failures
        if: failure()
        run: |
          echo "--- umask/id ---"
          umask; id
          echo "--- ACLs on /usr/share ---"
          getfacl -p /usr/share /usr/share/doc 2>/dev/null | head -20 || echo "no getfacl"
          echo "--- rpm version ---"
          rpm --version
          echo "--- sample installed modes ---"
          for f in /usr/share/doc/memveil/LICENSE /usr/bin/memveil; do
            stat -c '%a %n' "$f" 2>/dev/null || echo "missing: $f"
          done
      - name: Upload built packages
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: memveil-packages
          path: |
            target/package-test/rpm/*.rpm
            target/package-test/deb/*.deb
            target/package-test/tarball/*.tar.gz
          if-no-files-found: warn
          retention-days: 7

  pytest:
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          persist-credentials: false
      # Fail fast on an armed environment before any build:
      # this job runs the offline selection unarmed, so any
      # MEMVEIL_* arming variable (anything outside the
      # parameter allowlist in the selection file) refuses.
      - name: 'Guard: refuse armed environment'
        run: |
          python3 - <<'EOF'
          import json
          import os
          import sys
          sel = json.load(
              open("tests/pytest-ci-selection.json"))
          allow = set(sel["unarmed_allow_env"]["exact"])
          prefixes = tuple(
              sel["unarmed_allow_env"]["prefixes"])
          armed = sorted(
              key for key in os.environ
              if key.startswith("MEMVEIL_")
              and key not in allow
              and not key.startswith(prefixes))
          if armed:
              print("unarmed guard: refusing armed "
                    "environment: " + ", ".join(armed))
              sys.exit(1)
          print("unarmed: no MEMVEIL_* arming variables set")
          EOF
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            binutils bpftrace bpftool cpio python3-pytest \
            python3-yaml rpm rpm2cpio strace
          # readelf (binutils), rpmbuild (rpm), rpm2cpio,
          # cpio, and strace serve the packaging and
          # cleanroom suites; bpftrace and bpftool are only
          # resolved (never executed) by two matrix unit
          # tests over mocked row runs. The runner already
          # ships git, a C toolchain, ssh-keygen, and
          # dpkg-deb.
      - name: Install Rust toolchains
        run: |
          curl -fsSL -o /tmp/rustup-init \
            https://static.rust-lang.org/rustup/dist/x86_64-unknown-linux-gnu/rustup-init
          curl -fsSL -o /tmp/rustup-init.sha256 \
            https://static.rust-lang.org/rustup/dist/x86_64-unknown-linux-gnu/rustup-init.sha256
          (cd /tmp && sha256sum --check rustup-init.sha256)
          chmod +x /tmp/rustup-init
          /tmp/rustup-init -y --profile minimal --default-toolchain none
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          # Same pins as the rust-test job; this job runs
          # no lint or format gates, so it skips the
          # clippy/rustfmt components.
          rustup toolchain install 1.100.0 --profile minimal
          rustup toolchain install nightly-2026-05-20 --profile minimal \
            --component rust-src
      - name: Install bpf-linker 0.10.4
        run: cargo install bpf-linker --version 0.10.4 --locked
      - name: Warm the cargo cache for offline queries
        run: |
          cargo fetch --locked
          cargo fetch --locked --manifest-path crates/ebpf/Cargo.toml
      - name: Require pytest and PyYAML on the system interpreter
        run: |
          python3 -m pytest --version
          python3 -c "import yaml"
      - name: Build the release binary under test
        run: |
          cargo build --locked --release
          test -x target/release/memveil
          mkdir -p build
          ln -sfn "$GITHUB_WORKSPACE/target/release/memveil" build/memveil
      - name: Build the dev bundle tarball the runtime suites need
        run: |
          cargo test --locked --test package_tarball
      - name: Run the audited offline pytest selection
        run: |
          set -eu
          mapfile -t FILES < <(python3 -c 'import json; print("\n".join(json.load(open("tests/pytest-ci-selection.json"))["run"]))')
          test "${#FILES[@]}" -gt 0
          python3 -m pytest "${FILES[@]}" -q
