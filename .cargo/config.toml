# The x86-64 link must run under GNU ld: the shipped
# engine's loadable x86-64-v3 requirement (see build.rs)
# is a `-z x86-64-v3` note that rust-lld warns on and
# drops, while GNU ld merges it into PT_GNU_PROPERTY for
# the glibc loader to check. The packager refuses any
# binary without the mark, so only a GNU-ld link can
# seal. Bare `gcc` (never `cc`): rustc resolves `cc` to
# its own sysroot lld wrapper, while `gcc` falls through
# to the real driver on PATH.
[target.x86_64-unknown-linux-gnu]
linker = "gcc"
