[package]
name = "memveil"
version = "0.1.0"
edition = "2024"
rust-version = "1.100"
license = "GPL-3.0-or-later"
description = "MemVeil DMA-visibility observer (Rust userspace)"
publish = false

[lib]
name = "memveil"
path = "src/lib.rs"

[dependencies]
aya = "=0.14.0"
memveil-ebpf-common = { version = "0.0.0", path = "crates/ebpf-common", features = ["user"] }

[dev-dependencies]
aya-obj = "=0.3.0"

[workspace]
members = ["crates/ebpf-common"]
