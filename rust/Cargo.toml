[package]
name = "memveil"
version = "0.1.0"
edition = "2024"
rust-version = "1.100"
license = "GPL-3.0-or-later"
description = "MemVeil DMA-visibility observer (Rust userspace)"
publish = false

[lib]
name = "memveil"
path = "src/lib.rs"

# `aya = "=0.14.0"` is deliberately absent: Task 8 adds it to [dependencies]
# for the loader, and declaring it now would trip the unused-dependency warning.
[dev-dependencies]
aya-obj = "=0.3.0"

[workspace]
members = ["crates/ebpf-common"]
